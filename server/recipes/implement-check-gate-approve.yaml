id: implement-check-gate-approve
name: Implement, check, gate, approve
description: >
  Runs an agent to implement a change in a fresh worktree, runs the
  project's check commands against the result, and gates on approval
  before the run is considered complete.
category: agent-delivery
parameters:
  - key: agent
    label: Agent
    type: enum
    options: [codex, claude, hermes, shell]
    default: codex
  - key: title
    label: Task title
    type: string
    required: true
  - key: prompt
    label: Task prompt
    type: string
    required: true
  - key: gateOnFail
    label: On check failure
    type: enum
    options: [wait_approval, fail]
    default: wait_approval
  - key: interaction
    label: Interaction mode
    type: enum
    options: [autonomous, interactive]
    default: autonomous
  - key: model
    label: Model
    type: string
    default: ""
  - key: onBlocked
    label: On agent clarification
    type: enum
    options: [wait_approval, auto_answer, fail]
    default: wait_approval
  - key: blockedTimeoutMinutes
    label: Blocked timeout (minutes)
    type: number
    default: 30
    multiplier: 60000
steps:
  - id: implement
    name: Implement change
    executor: agent-task
    input:
      agent: "{{ agent }}"
      title: "{{ title }}"
      prompt: "{{ prompt }}"
      interaction: "{{ interaction }}"
      model: "{{ model }}"
    onBlocked:
      action: "{{ onBlocked }}"
      timeoutMs: "{{ blockedTimeoutMinutes }}"
  - id: check
    name: Run project checks
    executor: check
    dependsOn: [implement]
    qualityGate:
      evaluators:
        - type: check
      onFail: "{{ gateOnFail }}"
