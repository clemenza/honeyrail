id: implement-check-gate-approve
name: Implement, check, gate, approve
description: >
  Runs an agent to implement a change in a fresh worktree, re-verifies it
  with a fixed, step-level check command, and gates on approval before the
  run is considered complete. The default task (fizzbuzz + its own pytest
  suite) is deterministic and self-contained, so the recipe runs end-to-end
  on a freshly registered repo with zero project configuration.
category: agent-delivery
contractLevel: L2
parameters:
  - key: agent
    label: Agent
    type: enum
    options: [codex, claude, hermes, shell]
    default: codex
  - key: title
    label: Task title
    type: string
    default: Implement fizzbuzz with tests
  - key: prompt
    label: Task prompt
    type: string
    default: >
      Create fizzbuzz.py at the worktree root implementing fizzbuzz(n): it
      returns "Fizz" for multiples of 3, "Buzz" for multiples of 5,
      "FizzBuzz" for multiples of both, and otherwise str(n). Create
      test_fizzbuzz.py with pytest cases covering a multiple of 3 (3), a
      multiple of 5 (5), a multiple of both (15), and a plain number. Run
      `python -m pytest -q` yourself and make sure it passes before
      finishing. If anything is ambiguous, state your assumption and
      proceed instead of asking.
  - key: gateOnFail
    label: On check failure
    type: enum
    options: [wait_approval, fail]
    default: wait_approval
  - key: interaction
    label: Interaction mode
    type: enum
    options: [autonomous, interactive]
    default: autonomous
  - key: model
    label: Model
    type: string
    default: ""
  - key: onBlocked
    label: On agent clarification
    type: enum
    options: [wait_approval, auto_answer, fail]
    default: wait_approval
  - key: blockedTimeoutMinutes
    label: Blocked timeout (minutes)
    type: number
    default: 30
    multiplier: 60000
steps:
  - id: implement
    name: Implement change
    executor: agent-task
    input:
      agent: "{{ agent }}"
      title: "{{ title }}"
      prompt: "{{ prompt }}"
      interaction: "{{ interaction }}"
      model: "{{ model }}"
    onBlocked:
      action: "{{ onBlocked }}"
      timeoutMs: "{{ blockedTimeoutMinutes }}"
    produces: [diff, changed_files]
  - id: check
    name: Re-verify with pytest
    executor: check
    dependsOn: [implement]
    consumes: [diff]
    input:
      commands: ["python -m pytest -q"]
    qualityGate:
      evaluators:
        - type: check
      onFail: "{{ gateOnFail }}"
