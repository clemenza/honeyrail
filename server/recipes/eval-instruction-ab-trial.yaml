id: eval-instruction-ab-trial
name: "Eval trial: instruction-file A/B"
description: >
  One (variant, task, trial) cell of an instruction-file A/B eval (#25):
  injects the given instruction-file variant into a fresh worktree, runs
  the agent on a scoped task, re-verifies with a fixed check command, and
  gates on the result. Fully unattended - a blocked agent or a failed
  check fails the trial instead of waiting for a human, so a matrix of
  trials always terminates. Drive the full matrix with
  scripts/evals-ab-demo.ts; segment aggregate metrics by variant via
  GET /api/evals/metrics?instructionLabel=<label>. The prompt and
  instruction-file fields default to the fixture's baseline variant/fizzbuzz
  task so a single cell can be launched from the UI with zero configuration;
  override them per (variant, task) cell for a real comparison.
category: evals
contractLevel: L2
parameters:
  - key: agent
    label: Agent
    type: enum
    # null/minimal (#71) are calibration-probe baselines, not real agents -
    # included here specifically so this recipe (evals-ab-demo.ts's default)
    # can run the smoke matrix against them for task-difficulty calibration.
    options: [codex, claude, hermes, shell, "null", minimal]
    default: codex
  - key: title
    label: Task title
    type: string
    default: Eval trial task
  - key: prompt
    label: Task prompt
    type: string
    required: true
    default: >
      Create fizzbuzz.py at the worktree root with a function fizzbuzz(n: int)
      -> str that returns "Fizz" for multiples of 3, "Buzz" for multiples of
      5, "FizzBuzz" for multiples of both, and str(n) otherwise. Create
      test_fizzbuzz.py at the worktree root with pytest cases covering 3, 5,
      15, and a plain number. The verification command is
      `python -m pytest -q test_fizzbuzz.py`.
  - key: checkCommand
    label: Check command
    type: string
    default: python -m pytest -q
  - key: instructionPath
    label: Instruction file path
    type: string
    default: AGENTS.md
  - key: instructionContent
    label: Instruction file content
    type: string
    required: true
    default: |
      # Agent instructions

      Complete the task you are given. Be quick and keep the change small.
  - key: instructionLabel
    label: Instruction variant label
    type: string
    required: true
    default: baseline
  - key: model
    label: Model
    type: string
    default: ""
steps:
  - id: implement
    name: Implement change
    executor: agent-task
    input:
      agent: "{{ agent }}"
      title: "{{ title }}"
      prompt: "{{ prompt }}"
      interaction: autonomous
      model: "{{ model }}"
      instructionFile:
        path: "{{ instructionPath }}"
        content: "{{ instructionContent }}"
        label: "{{ instructionLabel }}"
    onBlocked:
      action: auto_retry
    produces: [diff, changed_files]
  - id: check
    name: Re-verify with check command
    executor: check
    dependsOn: [implement]
    consumes: [diff]
    input:
      commands: ["{{ checkCommand }}"]
    qualityGate:
      evaluators:
        - type: check
      onFail: fail
